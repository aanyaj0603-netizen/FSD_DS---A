<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num = [11,22,33,44,55,66,77,88,99];
        const even = num.filter((n) => n % 2 === 0);
        const square = even.map((n) => n * n);
        const sum = square.reduce((acc, curr) => acc + curr, 0);
        console.log("Num = ", num);
        console.log("Even = ", even);
        console.log("Square = ", square);
        console.log("Sum = ", sum);
    </script>
</body>
</html>
