<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter a number:"));
        let sum = 0;
        let temp = a;
        while (temp > 0) {
            let digit = temp % 10;
            sum += digit ** 3;
            temp = Math.floor(temp / 10);
        }
        if (sum === a) {
            console.log(a + " is an Armstrong number");
        } else {
            alert(a + " is not an Armstrong number");
        }
    </script>
</body>
</html>
