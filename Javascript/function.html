        //Name, cost and capacity of a product by using arrow function
        let n = prompt("Enter 1. car 2. helicopter 3. aeroplane: ");
        if(n==1){
            const car = () => {
                return "Name: Car, Cost: 20000$, Capacity: 5";
            };
            document.write("<br> " + car());
        }
        else if(n==2){

            };

        }

            };
