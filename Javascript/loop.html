<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="output"></p>
    <script>
        //code for (For loop)
        for (let i = 1; i <= 5; i++) {
            document.write("<br> abes college");
        }

        //Assignment 1
        const car = ["BMW", "Volvo", "Saab", "Ford"];
        let text = " ";
        for (let i = 0; i < car.length; i++) {
            text += "<br>" + car[i];
        }
        document.getElementById("output").innerHTML = text;

        //Assignment 2
        const car1 = ["Car1", "Car2", "Car3"];
        for(let j=0; j<car1.length; j=j+2){
            document.write("<br>" + car1[j]);
        }
    </script>
</body>
</html>
